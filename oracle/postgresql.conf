# The settings that the oracle and rudb share. `up` adds an include line for this file to the
# postgresql.conf that initdb writes, and sets the port and the socket directory on the command
# line. Every setting that is not here is the PostgreSQL default, per document 14 section 14.3 of
# the notes. Do not tune the oracle for speed here. rudb-bench has its own configuration for that.

listen_addresses = '127.0.0.1'

# The text of a timestamptz depends on the time zone, and lib/pq refuses any DateStyle that does
# not start with ISO.
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'

# Error text is compared, so it must be in English.
lc_messages = 'C'

# rudb has no two-phase commit until PG9.
max_prepared_transactions = 0

password_encryption = 'scram-sha-256'

# Both servers present the same certificate chain. `up` copies the files into the data directory.
ssl = on
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'
ssl_ca_file = 'root.crt'
