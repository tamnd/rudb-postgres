# The authentication rules that the oracle and rudb share, per document 14 section 14.3 of the
# notes. The first rule that matches a connection applies.
#
# The md5 and password cases use their own roles. A rule cannot select on the port, so a role is
# the way to give one server more than one method over TCP.

# TYPE  DATABASE  USER          ADDRESS       METHOD
local   all       all                         trust
host    all       rpg_md5       127.0.0.1/32  md5
host    all       rpg_password  127.0.0.1/32  password
host    all       all           127.0.0.1/32  scram-sha-256
host    all       all           ::1/128       scram-sha-256
