# Weekly is often enough for a crate with no dependencies. The actions are pinned to a patch
# version on purpose, and this file is what moves them.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      patch:
        update-types: ["patch"]
      minor:
        update-types: ["minor"]

  # Actions are pinned to a patch version on purpose, which means they need something to move
  # them. This is that something.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
