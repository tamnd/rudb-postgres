# The per-commit gate. Every job here is required to merge.
#
# Actions are pinned to a patch version, so that a run can be reproduced.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  quick:
    name: format and lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features

  test:
    name: test on ${{ matrix.os }}
    needs: quick
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo test
        run: cargo test --all-features
      - name: the command line answers
        run: cargo run -q -- help

  # The oracle, built from the pin and cached by the pin and the build script, which holds the
  # flags. A cold build takes about ten minutes, so the cache is what keeps this job short. The
  # job then starts the oracle and its twin, which proves that the shared configuration works on
  # a machine that is not the one it was written on.
  oracle:
    name: oracle build and up
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/cache@v5.0.5
        with:
          path: target/oracle
          key: oracle-${{ runner.os }}-${{ hashFiles('pins.toml', 'oracle/build.sh') }}
      - name: install the build tools
        run: sudo apt-get install -y --no-install-recommends meson ninja-build bison flex libssl-dev uuid-dev pkg-config
      - name: build the oracle
        run: cargo run -q --release -- oracle build
      - name: start the oracle and its twin
        run: cargo run -q --release -- up
      - name: connect over TLS with SCRAM
        env:
          PGPASSWORD: rpg
        run: |
          psql=$(ls -d target/oracle/*/bin | grep -v src)/psql
          $psql -X "host=127.0.0.1 port=55433 user=rpg dbname=postgres sslmode=verify-full sslrootcert=oracle/certs/root.crt" -c "select version()"
      - name: the connect matrix shows no difference between the oracle and its twin
        run: cargo run -q --release -- connect
      - name: the smoke file shows no difference between the oracle and its twin
        run: cargo run -q --release -- diff corpus/differential/smoke.sql
      - name: the regression suite passes on the oracle and its twin
        run: cargo run -q --release -- regress
      - name: the isolation specs pass on the oracle and its twin
        run: cargo run -q --release -- isolation
      - name: the proxy writes the same trace as libpq for each libpq_pipeline test
        env:
          PGPASSWORD: postgres
        run: |
          pipeline=$(ls -d target/oracle/*/test/pipeline | grep -v src)
          ldd "$pipeline/bin/libpq_pipeline" | grep libpq
          for test in $(ls "$pipeline/traces" | sed 's/\.trace$//'); do
            target/release/rudb-postgres record --to oracle --name "regress-$test" --sessions 1 &
            sleep 1
            "$pipeline/bin/libpq_pipeline" -t "run/libpq-$test.trace" "$test" "host=127.0.0.1 port=55440 user=postgres dbname=postgres sslmode=disable"
            wait
            diff -u "$pipeline/traces/$test.trace" "run/libpq-$test.trace"
            tail -n "$(wc -l < "run/libpq-$test.trace")" "run/traces/regress-$test-1.trace" | diff -u "run/libpq-$test.trace" -
          done
      - name: the recorded sessions replay the same on the oracle and its twin
        run: cargo run -q --release -- replay corpus/protocol/*/*.trace
      # Each run takes a new seed, and the output gives it, so a run that fails can be made again.
      - name: the generated statements give the same answers on the oracle and its twin
        run: cargo run -q --release -- gen --seed ${{ github.run_id }} --count 1000
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: astral-sh/setup-uv@v10.2.0
      - name: the client suites pass on the twin wherever they pass on the oracle
        run: cargo run -q --release -- client
      - name: the report page of the run goes to the job summary
        run: |
          cargo run -q --release -- report
          cat run/report/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: stop them
        run: cargo run -q --release -- down
      - name: keep the server logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-logs
          path: |
            run/*/server.log
            run/regress/*/regression.diffs
            run/isolation/*/regression.diffs
            run/results/*.json
            run/traces/*.trace
            run/gen/*.sql
          retention-days: 14

  ci:
    name: ci
    if: always()
    needs: [quick, test, oracle]
    runs-on: ubuntu-24.04
    steps:
      - name: fail if anything upstream failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: pass
        run: echo "all required jobs succeeded"
